<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>七宗罪 · 七美德 | 灵魂测试</title>
<style>
:root{
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:var(--sans);
  background:#06040a;
  color:#fff;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* ============ 主题变量 ============ */
#app{
  position:fixed;inset:0;overflow:hidden;
  transition:background .9s ease;
}
#app.theme-dark{
  --txt:#f2ecf8;
  --txt-dim:#8e82a0;
  --card:rgba(255,255,255,.045);
  --card-brd:rgba(180,140,255,.16);
  --accent:#b07cf0;
  --accent-soft:rgba(176,124,240,.13);
  --line:rgba(255,255,255,.09);
  background:radial-gradient(120% 80% at 50% 0%,#1e0f2a 0%,#0d0713 45%,#06040a 100%);
}
#app.theme-light{
  --txt:#2b2328;
  --txt-dim:#a0968e;
  --card:rgba(255,255,255,.72);
  --card-brd:rgba(201,168,106,.28);
  --accent:#c9a86a;
  --accent-soft:rgba(201,168,106,.14);
  --line:rgba(60,40,20,.1);
  background:radial-gradient(120% 80% at 50% 0%,#ffffff 0%,#f8f3ec 45%,#efe8de 100%);
}

/* ============ 粒子画布 ============ */
#fx{position:absolute;inset:0;z-index:1;pointer-events:none;}

/* ============ 屏幕容器 ============ */
.screen{
  position:absolute;inset:0;z-index:2;
  display:flex;overflow-y:auto;overflow-x:hidden;
  opacity:0;pointer-events:none;
  transition:opacity .7s ease;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.screen::-webkit-scrollbar{display:none;}
.screen.active{opacity:1;pointer-events:auto;}
.screen > .inner{
  margin:auto;width:100%;max-width:520px;
  padding:44px 24px;position:relative;
}

/* ============ 开始页 ============ */
.start-inner{text-align:center;}

.sigil-wrap{
  position:relative;width:240px;height:240px;
  margin:0 auto 26px;
  display:flex;align-items:center;justify-content:center;
}
.sigil-svg{
  position:absolute;inset:0;width:100%;height:100%;
  animation:fadeUp 1.2s cubic-bezier(.22,1,.36,1) both;
}
.spin-slow{animation:spin 34s linear infinite;transform-origin:120px 120px;}
.spin-rev{animation:spin 26s linear infinite reverse;transform-origin:120px 120px;}
.spin-mid{animation:spin 18s linear infinite;transform-origin:120px 120px;}
@keyframes spin{to{transform:rotate(360deg);}}

.sigil-core{
  position:relative;z-index:2;text-align:center;
  animation:fadeUp 1.4s .2s cubic-bezier(.22,1,.36,1) both;
}
.sigil-core .vii{
  font-family:var(--serif);
  font-size:44px;letter-spacing:.12em;
  background:linear-gradient(160deg,#e6d5ff 0%,#b07cf0 45%,#d8b46a 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  display:block;line-height:1;
  filter:drop-shadow(0 0 22px rgba(176,124,240,.55));
}
.sigil-core .vii-cn{
  display:block;margin-top:10px;
  font-size:11px;letter-spacing:.62em;
  color:var(--txt-dim);text-indent:.62em;
}

.eyebrow{
  font-size:10.5px;letter-spacing:.4em;text-indent:.4em;
  color:var(--txt-dim);margin-bottom:18px;
  animation:fadeUp 1s .35s cubic-bezier(.22,1,.36,1) both;
}
.main-title{
  font-family:var(--serif);
  font-size:clamp(30px,9vw,42px);
  font-weight:600;letter-spacing:.06em;
  line-height:1.25;
  background:linear-gradient(170deg,#ffffff 0%,#d9c6f5 42%,#b07cf0 78%,#e8c98a 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:fadeUp 1s .45s cubic-bezier(.22,1,.36,1) both;
}
.main-title .sep{
  font-size:.6em;opacity:.55;margin:0 .18em;
  -webkit-text-fill-color:initial;color:#b07cf0;
}
.main-sub{
  margin-top:12px;
  font-size:10px;letter-spacing:.52em;text-indent:.52em;
  color:rgba(216,180,106,.72);
  animation:fadeUp 1s .55s cubic-bezier(.22,1,.36,1) both;
}
.hairline{
  width:56px;height:1px;margin:26px auto;
  background:linear-gradient(90deg,transparent,rgba(216,180,106,.85),transparent);
  animation:fadeUp 1s .65s cubic-bezier(.22,1,.36,1) both;
}
.main-desc{
  font-size:13.5px;line-height:2.1;
  color:var(--txt-dim);letter-spacing:.05em;
  animation:fadeUp 1s .75s cubic-bezier(.22,1,.36,1) both;
}

.btn-start{
  position:relative;
  margin-top:40px;
  padding:17px 62px;
  border:none;border-radius:100px;
  font-family:var(--serif);
  font-size:16px;letter-spacing:.36em;text-indent:.36em;
  color:#fff;cursor:pointer;
  background:linear-gradient(135deg,#8a3ffc 0%,#b8449b 48%,#d8b46a 100%);
  background-size:200% 200%;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.14) inset,
    0 12px 44px -10px rgba(180,92,255,.75);
  animation:fadeUp 1s .85s cubic-bezier(.22,1,.36,1) both, btnGlow 3s ease-in-out 1.8s infinite, gradShift 6s ease infinite;
  transition:transform .3s cubic-bezier(.22,1,.36,1);
}
.btn-start:active{transform:scale(.96);}
@keyframes btnGlow{
  0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,.14) inset,0 12px 44px -10px rgba(180,92,255,.7);}
  50%{box-shadow:0 0 0 1px rgba(255,255,255,.26) inset,0 18px 64px -8px rgba(180,92,255,1);}
}
@keyframes gradShift{
  0%,100%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
}

.main-hint{
  margin-top:26px;
  font-size:11px;letter-spacing:.16em;
  color:rgba(255,255,255,.24);
  animation:fadeUp 1s 1s cubic-bezier(.22,1,.36,1) both;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(22px);}
  to{opacity:1;transform:translateY(0);}
}

/* ============ 答题页 ============ */
.quiz-inner{display:flex;flex-direction:column;justify-content:center;min-height:100%;}

.quiz-top{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;
}
.phase{
  font-size:11px;letter-spacing:.24em;
  color:var(--accent);
  display:flex;align-items:center;gap:8px;
}
.phase::before{
  content:'';width:5px;height:5px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 10px var(--accent);
  animation:pulseDot 1.8s ease-in-out infinite;
}
@keyframes pulseDot{
  0%,100%{opacity:1;transform:scale(1);}
  50%{opacity:.35;transform:scale(.7);}
}
.count{
  font-size:11px;letter-spacing:.18em;
  color:var(--txt-dim);
  font-variant-numeric:tabular-nums;
}

.bar{
  height:2px;width:100%;border-radius:2px;
  background:var(--line);
  overflow:hidden;position:relative;
  margin-bottom:38px;
}
.bar i{
  display:block;height:100%;width:0%;
  border-radius:2px;
  background:linear-gradient(90deg,var(--accent),#ffd27a);
  box-shadow:0 0 14px var(--accent);
  transition:width .55s cubic-bezier(.22,1,.36,1);
}

.qcard{will-change:transform,opacity;}
@keyframes cardIn{
  from{opacity:0;transform:translateY(26px) scale(.985);filter:blur(7px);}
  to{opacity:1;transform:none;filter:blur(0);}
}
@keyframes cardOut{
  from{opacity:1;transform:none;filter:blur(0);}
  to{opacity:0;transform:translateY(-20px) scale(.985);filter:blur(7px);}
}

.qnum{
  font-family:var(--serif);
  font-size:12px;letter-spacing:.34em;
  color:var(--accent);opacity:.85;
  margin-bottom:16px;
}
.qtext{
  font-family:var(--serif);
  font-size:clamp(18px,5.2vw,22px);
  line-height:1.72;
  font-weight:500;
  letter-spacing:.02em;
  color:var(--txt);
  margin-bottom:30px;
  min-height:2.6em;
}

.opts{display:flex;flex-direction:column;gap:12px;}
.opt{
  display:flex;align-items:flex-start;gap:14px;
  width:100%;
  padding:16px 18px;
  border-radius:16px;
  border:1px solid var(--card-brd);
  background:var(--card);
  color:var(--txt);
  font-family:var(--sans);
  font-size:14.5px;line-height:1.6;
  text-align:left;cursor:pointer;
  position:relative;overflow:hidden;
  transition:transform .35s cubic-bezier(.22,1,.36,1),
             border-color .35s ease,
             background .35s ease,
             box-shadow .35s ease,
             opacity .3s ease;
  animation:optIn .5s cubic-bezier(.22,1,.36,1) both;
}
@keyframes optIn{
  from{opacity:0;transform:translateX(-14px);filter:blur(4px);}
  to{opacity:1;transform:none;filter:blur(0);}
}
.opt::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%),var(--accent-soft),transparent 62%);
  opacity:0;transition:opacity .4s;
  pointer-events:none;
}
.opt:hover::after{opacity:1;}
.opt:hover{
  transform:translateX(5px);
  border-color:var(--accent);
}
.opt:active{transform:scale(.985);}
.opt.selected{
  border-color:var(--accent);
  background:var(--accent-soft);
  box-shadow:0 0 28px -6px var(--accent),0 0 0 1px var(--accent) inset;
  transform:translateX(6px) scale(1.012);
}
.opt.dim{opacity:.28;transform:scale(.985);}

.opt-key{
  flex:0 0 auto;
  width:23px;height:23px;border-radius:50%;
  display:grid;place-items:center;
  font-family:var(--serif);
  font-size:11px;
  border:1px solid currentColor;
  opacity:.42;
  margin-top:1px;
  transition:all .35s;
}
.opt.selected .opt-key{
  opacity:1;border-color:var(--accent);
  color:var(--accent);
  box-shadow:0 0 12px var(--accent);
}
.opt-text{flex:1;}

/* ============ 过渡幕布 ============ */
.curtain{
  position:fixed;inset:0;z-index:60;
  pointer-events:none;overflow:hidden;
}
.curtain-panel{
  position:absolute;inset:0;
  background:linear-gradient(180deg,#ffffff 0%,#f9f3ea 55%,#efe6d9 100%);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:22px;
  transform:translateY(101%);
  transition:transform .8s cubic-bezier(.76,0,.24,1);
}
.curtain.show .curtain-panel{transform:translateY(0);}
.curtain-text{
  font-family:var(--serif);
  font-size:21px;letter-spacing:.55em;text-indent:.55em;
  color:#2b2328;
  opacity:0;transform:translateY(12px);
  transition:opacity .6s .45s,transform .6s .45s;
}
.curtain.show .curtain-text{opacity:1;transform:none;}
.curtain-sub{
  font-size:10px;letter-spacing:.4em;text-indent:.4em;
  color:#b3a99e;
  opacity:0;transition:opacity .6s .65s;
}
.curtain.show .curtain-sub{opacity:1;}
.curtain-line{
  width:0;height:1px;
  background:linear-gradient(90deg,transparent,#c9a86a,transparent);
  transition:width .8s .3s cubic-bezier(.22,1,.36,1);
}
.curtain.show .curtain-line{width:120px;}

/* ============ 加载页 ============ */
#s-load .inner{text-align:center;}
.loader{
  position:relative;width:130px;height:130px;
  margin:0 auto 36px;
}
.loader-ring{
  position:absolute;inset:0;
  border-radius:50%;
  border:1px solid transparent;
  border-top-color:var(--accent);
  animation:spin 1.4s linear infinite;
}
.loader-ring.r2{
  inset:16px;
  border-top-color:transparent;
  border-right-color:#ff4d8d;
  animation-duration:1.9s;
  animation-direction:reverse;
}
.loader-ring.r3{
  inset:32px;
  border-top-color:transparent;
  border-bottom-color:#d8b46a;
  animation-duration:2.6s;
}
.loader-core{
  position:absolute;inset:0;
  display:grid;place-items:center;
  font-family:var(--serif);
  font-size:13px;letter-spacing:.28em;text-indent:.28em;
  color:var(--txt-dim);
}
.load-text{
  font-family:var(--serif);
  font-size:14px;letter-spacing:.22em;
  color:var(--txt);
  min-height:1.6em;
  transition:opacity .3s;
}

/* ============ 结果页 ============ */
#s-result .inner{padding-top:52px;padding-bottom:64px;}

.duo{
  display:flex;align-items:center;justify-content:center;
  gap:6px;margin-bottom:30px;
}
.duo-item{text-align:center;flex:1;max-width:140px;}
.duo-avatar{
  width:112px;height:112px;margin:0 auto 12px;
  animation:avatarPop .9s cubic-bezier(.

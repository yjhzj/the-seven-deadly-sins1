<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>七宗罪 · 七美德 | 灵魂天平测试</title>
<style>
/* ============ 基础 ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --serif:"Songti SC","STSong","Noto Serif SC",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
html,body{height:100%;width:100%;overflow:hidden}
body{
  font-family:var(--sans);
  background:#08070c;color:#e8e6f0;
  transition:background .9s ease,color .9s ease;
  -webkit-font-smoothing:antialiased;
}

body.theme-sin{
  --accent:#ff3b6b; --accent2:#a855f7; --accent-soft:rgba(255,59,107,.13);
  --card-bg:rgba(24,18,34,.72); --card-border:rgba(255,255,255,.09);
  --text:#ece9f5; --dim:#8e88a6;
  --shadow:0 30px 80px rgba(139,92,246,.22);
  background:#08070c;color:#ece9f5;
}
body.theme-holy{
  --accent:#c8a13a; --accent2:#e3cf9a; --accent-soft:rgba(200,161,58,.14);
  --card-bg:rgba(255,255,255,.72); --card-border:rgba(190,168,124,.35);
  --text:#2b2620; --dim:#8f8677;
  --shadow:0 30px 80px rgba(200,161,58,.16);
  background:#faf7f1;color:#2b2620;
}
body.theme-result{
  --accent:#d9b25c; --accent2:#ff5b7f; --accent-soft:rgba(217,178,92,.12);
  --card-bg:rgba(255,255,255,.045); --card-border:rgba(255,255,255,.10);
  --text:#f0ecf7; --dim:#948da8;
  --shadow:0 30px 80px rgba(0,0,0,.55);
  background:#0a0810;color:#f0ecf7;
}

#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1}

.screen{
  position:fixed;inset:0;display:none;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  z-index:1;
}
.screen.active{display:flex}

/* ============ 开始界面 ============ */
#s-start{align-items:center;justify-content:center}
.half{position:absolute;top:0;bottom:0;width:50%;overflow:hidden;z-index:1}
.half-l{left:0;background:radial-gradient(ellipse at 78% 48%,#3d0d24 0%,#190818 42%,#06040a 100%)}
.half-r{right:0;background:radial-gradient(ellipse at 22% 48%,#fffdf7 0%,#f4eee1 45%,#e5dbc4 100%)}
.half-l::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 72% 28%,rgba(255,59,107,.20),transparent 58%),
             radial-gradient(circle at 40% 80%,rgba(168,85,247,.16),transparent 62%);
}
.half-r::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 26% 26%,rgba(255,255,255,.95),transparent 58%),
             radial-gradient(circle at 60% 84%,rgba(200,161,58,.14),transparent 62%);
}
.half-art{position:absolute;bottom:4%;width:min(82%,330px);opacity:.92;pointer-events:none}
.half-l .half-art{right:4%;animation:floatA 8s ease-in-out infinite}
.half-r .half-art{left:4%;animation:floatB 8s ease-in-out infinite}
@keyframes floatA{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-14px) rotate(1.5deg)}}
@keyframes floatB{0%,100%{transform:translateY(0) rotate(1.5deg)}50%{transform:translateY(-14px) rotate(-1.5deg)}}

.seam{
  position:absolute;left:50%;top:0;bottom:0;width:1px;transform:translateX(-.5px);z-index:2;
  background:linear-gradient(to bottom,transparent 0%,rgba(255,59,107,.75) 26%,rgba(255,255,255,.95) 50%,rgba(200,161,58,.75) 74%,transparent 100%);
  box-shadow:0 0 26px rgba(255,255,255,.5);
  animation:seamGlow 4s ease-in-out infinite;
}
@keyframes seamGlow{0%,100%{opacity:.7}50%{opacity:1}}

.start-core{
  position:relative;z-index:5;text-align:center;padding:0 26px;max-width:600px;
  animation:coreIn 1.2s cubic-bezier(.16,1,.3,1);
}
@keyframes coreIn{from{opacity:0;transform:translateY(26px) scale(.96);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}

.kicker{
  font-size:11px;letter-spacing:.52em;text-indent:.52em;
  color:rgba(255,255,255,.55);margin-bottom:20px;font-weight:500;
}
.title{
  font-family:var(--serif);
  font-size:clamp(30px,7.2vw,54px);
  letter-spacing:.05em;line-height:1.16;font-weight:600;
  background:linear-gradient(100deg,#ff3b6b 0%,#ff9ab5 24%,#ffffff 50%,#f5e6bd 76%,#c8a13a 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 34px rgba(255,59,107,.34));
}
.title .x{font-size:.72em;opacity:.85;margin:0 .12em}
.sub{
  margin-top:18px;font-size:14.5px;line-height:1.9;
  color:rgba(255,255,255,.62);letter-spacing:.06em;
}
.hint{margin-top:26px;font-size:11.5px;letter-spacing:.14em;color:rgba(255,255,255,.38)}

.btn-start{
  position:relative;margin-top:34px;padding:17px 58px;border:none;border-radius:999px;cursor:pointer;
  font-family:var(--sans);font-size:16px;font-weight:600;letter-spacing:.22em;text-indent:.22em;color:#fff;
  background:linear-gradient(100deg,#ff3b6b 0%,#a855f7 52%,#e0b84a 100%);
  background-size:220% 100%;
  box-shadow:0 12px 44px rgba(168,85,247,.45),inset 0 0 0 1px rgba(255,255,255,.18);
  transition:transform .4s cubic-bezier(.16,1,.3,1),box-shadow .4s,background-position .6s;
  animation:btnPulse 3s ease-in-out infinite;
}
@keyframes btnPulse{
  0%,100%{box-shadow:0 12px 44px rgba(168,85,247,.42),inset 0 0 0 1px rgba(255,255,255,.18)}
  50%{box-shadow:0 16px 60px rgba(255,59,107,.55),inset 0 0 0 1px rgba(255,255,255,.3)}
}
.btn-start:hover{background-position:100% 0;transform:translateY(-3px) scale(1.035)}
.btn-start:active{transform:translateY(0) scale(.98)}
.btn-start.small{padding:14px 42px;font-size:14px;margin-top:0;animation:none}

/* ============ 答题界面 ============ */
#s-quiz{flex-direction:column}
.quiz-head{width:100%;max-width:720px;margin:0 auto;padding:34px 24px 0}
.quiz-meta{
  display:flex;justify-content:space-between;align-items:center;
  font-size:11.5px;letter-spacing:.2em;color:var(--dim);margin-bottom:14px;font-weight:500;
}
#phaseTag{transition:color .6s}
.tag-sin{color:#ff5b7f}
.tag-holy{color:#c8a13a}
.progress{
  position:relative;height:3px;border-radius:4px;
  background:rgba(140,140,160,.16);overflow:hidden;
}
.progress-fill{
  height:100%;width:0;border-radius:4px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  box-shadow:0 0 16px var(--accent);
  transition:width .65s cubic-bezier(.16,1,.3,1),background .8s;
}
.progress-fill::after{
  content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
  animation:shine 2.4s linear infinite;
}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

.quiz-body{flex:1;display:flex;align-items:center;justify-content:center;padding:30px 20px 60px}
.card{
  position:relative;width:100%;max-width:680px;
  background:var(--card-bg);border:1px solid var(--card-border);
  border-radius:26px;padding:38px 32px 32px;
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  box-shadow:var(--shadow);
  transition:background .8s,border-color .8s,box-shadow .8s;
  overflow:hidden;
}
.card::before{
  content:'';position:absolute;inset:0;border-radius:26px;padding:1px;pointer-events:none;
  background:linear-gradient(145deg,var(--accent),transparent 42%,transparent 58%,var(--accent2));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  opacity:.5;transition:background .8s;
}
.card.anim-in{animation:cardIn .58s cubic-bezier(.16,1,.3,1)}
@keyframes cardIn{
  from{opacity:0;transform:translateY(28px) scale(.955);filter:blur(10px)}
  to{opacity:1;transform:none;filter:blur(0)}
}

.card-num{
  font-size:11px;letter-spacing:.34em;color:var(--accent);
  font-weight:700;margin-bottom:16px;transition:color .8s;
}
.qtext{
  font-family:var(--serif);
  font-size:clamp(18px,4.6vw,23px);
  line-height:1.62;font-weight:600;letter-spacing:.02em;
  color:var(--text);transition:color .8s;
}

.options{display:flex;flex-direction:column;gap:11px;margin-top:26px}
.opt{
  position:relative;display:block;width:100%;text-align:left;
  padding:15px 20px 15px 56px;border-radius:15px;cursor:pointer;
  background:transparent;border:1px solid var(--card-border);
  color:var(--text);font-size:15px;line-height:1.55;font-family:var(--sans);
  transition:border-color .3s,background .3s,transform .3s,color .8s;
  overflow:hidden;
}
.opt:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateX(5px)}
.opt:active{transform:translateX(5px) scale(.985)}
.opt .letter{
  position:absolute;left:17px;top:50%;transform:translateY(-50%);
  width:24px;height:24px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:700;
  background:var(--accent-soft);color:var(--accent);
  border:1px solid var(--card-border);
  transition:background .3s,color .3s,border-color .3s;
}
.opt:hover .letter{background:var(--accent);color:#fff;border-color:var(--accent)}
.opt.selected{border-color:var(--accent);background:var(--accent-soft)}
.opt.selected .letter{background:var(--accent);color:#fff;border-color:var(--accent)}
.opt.dim{opacity:.32;filter:blur(.4px)}

.ripple{
  position:absolute;border-radius:50%;background:var(--accent);
  opacity:.36;transform:scale(0);pointer-events:none;
  animation:rip .62s ease-out forwards;
}
@keyframes rip{to{transform:scale(4.2);opacity:0}}

/* ============ 加载界面 ============ */
#s-loading{align-items:center;justify-content:center;flex-direction:column;background:#0a0810}
.loader{position:relative;width:170px;height:170px;display:flex;align-items:center;justify-content:center}
.ring{
  position:absolute;inset:0;border-radius:50%;
  border:1.5px solid transparent;
  border-top-color:#ff3b6b;border-right-color:rgba(168,85,247,.6);
  animation:spin 1.6s linear infinite;
}
.ring.r2{inset:24px;border-top-color:#e0b84a;border-right-color:rgba(255,255,255,.35);animation-duration:2.4s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{
  position:absolute;bottom:-58px;left:50%;transform:translateX(-50%);
  white-space:nowrap;font-size:12.5px;letter-spacing:.34em;color:rgba(255,255,255,.5);
  animation:blink 2s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:.4}50%{opacity:1}}

/* ============ 结果界面 ============ */
#s-result{flex-direction:column;align-items:center}
.result-wrap{width:100%;max-width:980px;margin:0 auto;padding:58px 22px 90px}

.res-head{text-align:center;margin-bottom:38px;animation:coreIn .9s cubic-bezier(.16,1,.3,1)}
.res-kicker{font-size:10.5px;letter-spacing:.46em;text-indent:.46em;color:var(--dim)}
.res-title{
  font-family:var(--serif);font-size:clamp(26px,5.4vw,40px);
  letter-spacing:.1em;margin:14px 0 14px;font-weight:600;
  background:linear-gradient(100deg,#ff5b7f,#f3e3b8 50%,#d9b25c);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.res-balance{
  font-size:13px;letter-spacing:.1em;color:var(--dim);line-height:2;max-width:640px;margin:0 auto;
}
.res-balance b{color:#d9b25c;font-weight:600}

.res-panels{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:22px}
@media(max-width:780px){.res-panels{grid-template-columns:1fr}}

.panel{
  position:relative;border-radius:26px;padding:26px 24px 30px;
  border:1px solid var(--card-border);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  overflow:hidden;
  animation:panelIn .9s cubic-bezier(.16,1,.3,1) both;
}
.panel-demon{
  background:linear-gradient(168deg,rgba(130,22,58,.30),rgba(22,10,32,.55));
  border-color:rgba(255,90,120,.26);
  box-shadow:0 30px 90px rgba(255,45,85,.14) inset,0 20px 60px rgba(0,0,0,.4);
  animation-delay:.1s;
}
.panel-angel{
  background:linear-gradient(168deg,rgba(240,214,150,.18),rgba(255,255,255,.05));
  border-color:rgba(230,200,130,.3);
  box-shadow:0 30px 90px rgba(240,210,140,.12) inset,0 20px 60px rgba(0,0,0,.4);
  animation-delay:.24s;
}
@keyframes panelIn{from{opacity:0;transform:translateY(34px) scale(.96)}to{opacity:1;transform:none}}

.art-wrap{
  display:flex;justify-content:center;align-items:center;
  margin-bottom:6px;
}
.art-wrap svg{width:min(100%,230px);height:auto;display:block;filter:drop-shadow(0 10px 40px rgba(0,0,0,.5))}
.panel-demon .art-wrap svg{animation:floatA 7s ease-in-out infinite}
.panel-angel .art-wrap svg{animation:floatB 7s ease-in-out infinite}

.badge{
  display:inline-block;font-size:10px;letter-spacing:.3em;text-indent:.3em;
  padding:6px 13px;border-radius:999px;margin-bottom:14px;font-weight:600;
}
.panel-demon .badge{background:rgba(255,59,107,.16);color:#ff8fa8;border:1px solid rgba(255,59,107,.34)}
.panel-angel .badge{background:rgba(217,178,92,.16);color:#e8c976;border:1px solid rgba(217,178,92,.4)}

.p-name{
  font-family:var(--serif);font-size:29px;letter-spacing:.16em;
  font-weight:600;line-height:1.2;
}
.panel-demon .p-name{color:#ffdce4}
.panel-angel .p-name{color:#fdf3d8}
.p-sub{font-size:11px;letter-spacing:.24em;color:var(--dim);margin-top:9px;margin-bottom:18px}
.p-desc{font-size:13.8px;line-height:2;color:rgba(240,236,247,.78);letter-spacing:.02em}
.panel-angel .p-desc{color:rgba(245,240,230,.8)}
.p-quote{
  margin-top:20px;padding:15px 16px;border-radius:14px;
  font-family:var(--serif);font-size:13.5px;line-height:1.85;letter-spacing:.05em;
}
.panel-demon .p-quote{background:rgba(255,59,107,.09);border-left:2px solid rgba(255,59,107,.6);color:#ffb9c8}
.panel-angel .p-quote{background:rgba(217,178,92,.1);border-left:2px solid rgba(217,178,92,.7);color:#efdca8}

/* 圆形分布图 */
.charts{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px}
@media(max-width:780px){.charts{grid-template-columns:1fr}}
.chart-box{
  border-radius:26px;padding:24px 22px 26px;
  border:1px solid var(--card-border);background:var(--card-bg);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:flex;flex-direction:column;align-items:center;
  animation:panelIn .9s cubic-bezier(.16,1,.3,1) both;animation-delay:.34s;
}
.chart-title{
  display:flex;align-items:center;gap:9px;align-self:flex-start;
  font-size:12px;letter-spacing:.24em;color:var(--dim);margin-bottom:16px;font-weight:600;
}
.chart-title .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot.d1{background:#ff3b6b;box-shadow:0 0 12px #ff3b6b}
.dot.d2{background:#d9b25c;box-shadow:0 0 12px #d9b25c}

.donut{position:relative;width:230px;height:230px}
.donut svg{width:100%;height:100%;animation:donutIn 1.1s cubic-bezier(.16,1,.3,1) both .45s}
@keyframes donutIn{from{opacity:0;transform:scale(.82) rotate(-12deg)}to{opacity:1;transform:none}}
.donut-center{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;pointer-events:none;
}
.donut-center .dc-label{font-size:9.5px;letter-spacing:.3em;color:var(--dim);margin-bottom:7px}
.donut-center .dc-val{font-family:var(--serif);font-size:21px;letter-spacing:.1em;font-weight:600}
.donut-center .dc-pct{font-size:11px;color:var(--dim);margin-top:5px;letter-spacing:.1em}

.legend{display:grid;grid-template-columns:1fr 1fr;gap:9px 16px;width:100%;margin-top:20px}
.legend-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim)}
.legend-item i{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
.legend-item b{margin-left:auto;color:var(--text);font-weight:600;font-size:11.5px}

.res-footer{display:flex;justify-content:center;margin-top:44px}
.res-footer .btn-start{
  background:linear-gradient(100deg,#d9b25c,#ff5b7f);
  background-size:200% 100%;
  box-shadow:0 12px 40px rgba(217,178,92,.32);
}
</style>
</head>
<body class="theme-sin">

<canvas id="fx"></canvas>

<div id="app">

  <!-- ========== 开始界面 ========== -->
  <section class="screen active" id="s-start">
    <div class="half half-l"><div class="half-art" id="startDemon"></div></div>
    <div class="half half-r"><div class="half-art" id="startAngel"></div></div>
    <div class="seam"></div>
    <div class="start-core">
      <div class="kicker">SOUL BALANCE TEST</div>
      <h1 class="title">七宗罪<span class="x">×</span>七美德</h1>
      <p class="sub">你的灵魂里，藏着一头不肯低头的恶魔<br>也住着一位尚未苏醒的天使</p>
      <button class="btn-start" id="btnStart">开始测试</button>
      <p class="hint">30 道题 · 约 5 分钟 · 请凭第一直觉作答</p>
    </div>
  </section>

  <!-- ========== 答题界面 ========== -->
  <section class="screen" id="s-quiz">
    <div class="quiz-head">
      <div class="quiz-meta">
        <span id="phaseTag" class="tag-sin">暗面 · 七宗罪</span>
        <span id="qIndex">01 / 30</span>
      </div>
      <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="quiz-body">
      <div class="card" id="card">
        <div class="card-num" id="cardNum">Q.01</div>
        <h2 class="qtext" id="qText"></h2>
        <div class="options" id="options"></div>
      </div>
    </div>
  </section>

  <!-- ========== 加载界面 ========== -->
  <section class="screen" id="s-loading">
    <div class="loader">
      <div class="ring"></div>
      <div class="ring r2"></div>
      <div class="loader-text">正在称量你的灵魂…</div>
    </div>
  </section>

  <!-- ========== 结果界面 ========== -->
  <section class="screen" id="s-result">
    <div class="result-wrap">
      <div class="res-head">
        <div class="res-kicker">YOUR SOUL REPORT</div>
        <h2 class="res-title">灵 魂 天 平 报 告</h2>
        <div class="res-balance" id="balanceText"></div>
      </div>

      <div class="res-panels">
        <div class="panel panel-demon" id="panelDemon"></div>
        <div class="panel panel-angel" id="panelAngel"></div>
      </div>

      <div class="charts">
        <div class="chart-box">
          <div class="chart-title"><span class="dot d1"></span>罪 · 分布图</div>
          <div class="donut" id="donutSin"></div>
          <div class="legend" id="legendSin"></div>
        </div>
        <div class="chart-box">
          <div class="chart-title"><span class="dot d2"></span>美德 · 分布图</div>
          <div class="donut" id="donutHoly"></div>
          <div class="legend" id="legendHoly"></div>
        </div>
      </div>

      <div class="res-footer">
        <button class="btn-start small" id="btnRestart">重 新 测 试</button>
      </div>
    </div>
  </section>

</div>

<script>
(function(){
'use strict';

/* =========================================================
   一、数据层
   ========================================================= */

var SIN_KEYS = ['pride','envy','wrath','sloth','greed','gluttony','lust'];
var HOLY_KEYS = ['humility','kindness','patience','diligence','charity','temperance','purity'];

/* ---------- 七宗罪 ---------- */
var SIN_META = {
  pride:{
    name:'傲慢', en:'PRIDE', being:'路西法', color:'#a855f7',
    desc:'你的灵魂深处烧着一团不肯低头的火。你相信自己的判断高于一切，即使独处时也在审视自己是否足够耀眼。这份骄傲让你远离平庸，也让你远离他人——因为在你眼里，世界是一面镜子，而你只在意镜中的自己。',
    quote:'低头不是认输，是为了看清脚下的路。'
  },

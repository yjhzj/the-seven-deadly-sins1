<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>七宗罪 · 七美德 | 灵魂镜像测试</title>
<style>
:root{
  --gold:#c9a961;
  --txt:#f2ede3;
  --txt2:rgba(242,237,227,.5);
  --line:rgba(201,169,97,.26);
  --card:rgba(255,255,255,.045);
}
body.light{
  --gold:#a8894a;
  --txt:#1c1a17;
  --txt2:rgba(28,26,23,.5);
  --line:rgba(28,26,23,.1);
  --card:#ffffff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  background:#08060d;color:var(--txt);overflow:hidden;
  transition:background .8s ease,color .5s ease;
}
body.light{
  background:
    radial-gradient(1000px 560px at 15% 0%,#fdf6ec 0%,transparent 62%),
    radial-gradient(900px 520px at 92% 100%,#eef3ff 0%,transparent 60%),
    #f7f4ef;
}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;transition:opacity .8s}
body.light #bg{opacity:0}
#stage{position:relative;z-index:1;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:44px 22px;position:relative}
.hidden{display:none!important}

/* ========== 开始页 ========== */
.hero{text-align:center;animation:riseIn .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes riseIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.tiny{display:block;font-size:10px;letter-spacing:.42em;color:var(--gold);opacity:.85;text-transform:uppercase}
.t-sin{
  font-size:clamp(46px,13.5vw,66px);font-weight:800;letter-spacing:.1em;margin-top:14px;
  background:linear-gradient(180deg,#ffffff 0%,#bda9dd 58%,#6b5890 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px rgba(150,120,220,.28));
}
.t-virtue{
  font-size:clamp(46px,13.5vw,66px);font-weight:800;letter-spacing:.1em;
  background:linear-gradient(180deg,#fff8e6 0%,#ecd9a6 52%,#c9a961 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px rgba(201,169,97,.3));
}
.divider{display:flex;align-items:center;gap:16px;margin:16px auto;max-width:280px;opacity:.65}
.divider i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.divider em{font-style:normal;color:var(--gold);font-size:13px;letter-spacing:.2em}
.intro{margin-top:30px;font-size:13.5px;line-height:2;color:var(--txt2);letter-spacing:.08em}
.btn-start{
  position:relative;margin-top:46px;padding:17px 56px;border:1px solid var(--gold);
  border-radius:100px;background:rgba(201,169,97,.07);color:var(--gold);
  font-size:14px;letter-spacing:.34em;text-indent:.34em;cursor:pointer;
  overflow:hidden;font-family:inherit;transition:transform .25s;
}
.btn-start::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.4) 50%,transparent 75%);
  transform:translateX(-130%);animation:sheen 3.4s infinite;
}
@keyframes sheen{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.btn-start:active{transform:scale(.955)}
.hint{margin-top:22px;font-size:11px;letter-spacing:.2em;color:var(--txt2);opacity:.7}

/* ========== 答题页 ========== */
.quiz-wrap{width:100%;max-width:520px;margin:0 auto}
.q-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.q-head span{font-size:10px;letter-spacing:.32em;color:var(--gold);opacity:.9}
#qNum{font-variant-numeric:tabular-nums}
.progress{height:2px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:40px}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,rgba(201,169,97,.35),var(--gold));transition:width .45s cubic-bezier(.4,0,.2,1)}
.card{transition:opacity .28s ease,transform .28s cubic-bezier(.4,0,.2,1)}
.card.out{opacity:0;transform:translateY(16px) scale(.985)}
.q-text{font-size:19px;line-height:1.72;font-weight:600;letter-spacing:.02em;margin-bottom:34px;min-height:66px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{
  width:100%;display:flex;gap:14px;align-items:flex-start;padding:17px 18px;
  border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--txt);
  font-size:14.5px;line-height:1.55;text-align:left;cursor:pointer;font-family:inherit;
  transition:transform .2s,border-color .25s,background .25s,box-shadow .25s;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
body.light .opt{box-shadow:0 8px 26px rgba(60,45,20,.055)}
.opt i{
  font-style:normal;flex:0 0 auto;width:22px;height:22px;border-radius:50%;
  display:grid;place-items:center;font-size:10.5px;border:1px solid var(--line);color:var(--gold);margin-top:1px;
}
.opt:active{transform:scale(.975)}
.opt.picked{border-color:var(--gold);background:rgba(201,169,97,.15);box-shadow:0 0 0 3px rgba(201,169,97,.1)}
.opt.picked i{background:var(--gold);color:#fff;border-color:var(--gold)}

/* ========== 结果页 ========== */
.result-wrap{width:100%;max-width:560px;margin:0 auto;padding:20px 0 60px}
.res-block{text-align:center;padding:36px 20px;border-radius:26px;margin-bottom:24px;animation:riseIn .8s cubic-bezier(.2,.8,.2,1) both}
.sin-block{background:linear-gradient(170deg,rgba(120,90,180,.16),rgba(20,14,30,.5));border:1px solid rgba(160,130,220,.22)}
.virtue-block{background:#fff;border:1px solid rgba(0,0,0,.06);box-shadow:0 18px 50px rgba(90,70,40,.09);animation-delay:.25s}
.res-label{display:block;font-size:9.5px;letter-spacing:.4em;color:var(--gold);margin-bottom:22px}
.avatar{position:relative;width:150px;height:150px;margin:0 auto 22px;display:grid;place-items:center}
.aura{position:absolute;inset:-22%;border-radius:50%;background:radial-gradient(circle,var(--c) 0%,transparent 68%);opacity:.4;filter:blur(12px);animation:breathe 4.5s ease-in-out infinite}
.ring{position:absolute;inset:0;border-radius:50%;border:1px dashed var(--c);opacity:.45;animation:spin 22s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.09)}}
.face{font-size:56px;line-height:1;filter:drop-shadow(0 0 20px var(--c))}
.res-block h2{font-size:30px;letter-spacing:.14em;font-weight:800;margin-bottom:8px}
.res-en{font-size:10px;letter-spacing:.4em;color:var(--gold);opacity:.85;margin-bottom:22px}
.res-desc{font-size:14px;line-height:2;color:var(--txt2);text-align:left;padding:0 6px;margin-bottom:16px}
.res-tip{font-size:12.5px;line-height:1.9;color:var(--gold);text-align:left;padding:12px 16px;border-left:2px solid var(--gold);background:rgba(201,169,97,.07);border-radius:0 10px 10px 0}
.virtue-block .res-desc,.virtue-block .res-tip{color:rgba(28,26,23,.6)}
.virtue-block .res-tip{color:#8a6d33;background:rgba(168,137,74,.08);border-left-color:#a8894a}

.chart-block{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:30px 18px 26px;margin-bottom:24px;animation:riseIn .8s cubic-bezier(.2,.8,.2,1) .12s both;backdrop-filter:blur(10px)}
body.light .chart-block{background:#fff;box-shadow:0 18px 50px rgba(90,70,40,.07)}
.chart-block h3{text-align:center;font-size:12px;letter-spacing:.3em;color:var(--gold);font-weight:500;margin-bottom:18px}
#chart{width:100%;max-width:300px;display:block;margin:0 auto;overflow:visible}
.seg{animation:segIn .65s cubic-bezier(.2,.8,.2,1) both}
@keyframes segIn{from{opacity:0;transform:scale(.82);transform-origin:150px 150px}to{opacity:.9;transform:none}}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;margin-top:24px}
.legend span{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--txt2);letter-spacing:.06em}
.legend b{width:7px;height:7px;border-radius:2px;display:block}

.btn-again{
  display:block;width:100%;padding:16px;border:1px solid var(--line);border-radius:100px;
  background:transparent;color:var(--txt);font-size:13px;letter-spacing:.3em;text-indent:.3em;
  font-family:inherit;cursor:pointer;transition:.25s;
}
.btn-again:active{transform:scale(.97);border-color:var(--gold);color:var(--gold)}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="stage">

  <!-- 开始页 -->
  <section class="screen" id="screen-start">
    <div class="hero">
      <span class="tiny">Seven Deadly Sins</span>
      <h1 class="t-sin">七宗罪</h1>
      <div class="divider"><i></i><em>×</em><i></i></div>
      <h1 class="t-virtue">七美德</h1>
      <span class="tiny" style="margin-top:14px">Seven Heavenly Virtues</span>
      <p class="intro">30 道题 · 14 个维度<br>照见你灵魂里同时存在的暗与光</p>
      <button class="btn-start" id="btnStart">开始测试</button>
      <p class="hint">约 4 分钟 · 请凭第一直觉作答</p>
    </div>
  </section>

  <!-- 答题页 -->
  <section class="screen hidden" id="screen-quiz">
    <div class="quiz-wrap">
      <div class="q-head">
        <span id="qPart">DARK SIDE</span>
        <span id="qNum">01 / 30</span>
      </div>
      <div class="progress"><i id="bar"></i></div>
      <div class="card" id="card">
        <p class="q-text" id="qText"></p>
        <div class="opts" id="opts"></div>
      </div>
    </div>
  </section>

  <!-- 结果页 -->
  <section class="screen hidden" id="screen-result">
    <div class="result-wrap">

      <div class="res-block sin-block">
        <span class="res-label">YOUR DOMINANT SIN</span>
        <div class="avatar" id="sinAvatar"></div>
        <h2 id="sinName">—</h2>
        <p class="res-en" id="sinEn">—</p>
        <p class="res-desc" id="sinDesc"></p>
        <p class="res-tip" id="sinTip"></p>
      </div>

      <div class="chart-block">
        <h3>灵 魂 分 布 图 谱</h3>
        <svg id="chart" viewBox="0 0 300 300"></svg>
        <div class="legend" id="legend"></div>
      </div>

      <div class="res-block virtue-block">
        <span class="res-label">YOUR DOMINANT VIRTUE</span>
        <div class="avatar" id="virAvatar"></div>
        <h2 id="virName">—</h2>
        <p class="res-en" id="virEn">—</p>
        <p class="res-desc" id="virDesc"></p>
        <p class="res-tip" id="virTip"></p>
      </div>

      <button class="btn-again" id="btnAgain">重 新 测 试</button>
    </div>
  </section>

</div>

<script>
(function(){
'use strict';

/* ============================================================
   一、维度数据（14 个维度，含文案）
   ============================================================ */
var SINS = {
  pride:{n:'傲慢',en:'PRIDE',e:'👑',c:'#a78bfa',
    d:'你把「更好」当成呼吸。你无法忍受平庸，也无法忍受被忽略。这份骄傲推着你往前走了很远，也让你在深夜里反复确认同一件事：我到底够不够好。',
    t:'偶尔允许自己普通一次，你会发现世界没有塌下来。'},

    t:'先做五分钟，五分钟之后再说。'},
  greed:{n:'贪婪',en:'GREED',e:'💰',c:'#fbbf24',
    d:'你讨厌「不够」这两个字。你收集资源、机会、备选项，像一个在为永远不会来的冬天做准备的人，囤积本身就是安全感。',

    t:'把「想要」和「需要」分开来看。'}

var VIRTUES = {
  humility:{n:'谦逊',en:'HUMILITY',e:'🕊',c:'#a8b3c9',
    d:'你不需要站在最中间，也清楚自己站在哪里。这不是退缩，而是一种很少人拥有的、稳定的自我认知——你知道自己是谁。',
    t:'记得：谦逊不等于否定自己。'},
  kindness:{n:'善良',en:'KINDNESS',e:'💗',c:'#ef9db3',
    d:'你对别人的处境有天然的敏感。你常常在别人开口之前就已经伸出手，有时甚至忘了，你自己也是需要被照顾的那一个。',
    t:'把对别人的耐心，分一点给自己。'},
  patience:{n:'忍耐',en:'PATIENCE',e:'🌿',c:'#5fb894',
    d:'你比大多数人都能等。你知道有些事急不来，所以你把情绪收好，等一个更合适的时机——这份沉得住气，是稀缺能力。',
    t:'忍耐不等于压抑，记得给自己出口。'},
  diligence:{n:'勤奋',en:'DILIGENCE',e:'⚡',c:'#c9a441',
    d:'你不相信天上掉东西，你只相信一步一步。你的安全感来自「我在推进」这件事本身，哪怕慢，也从不停。',
    t:'允许自己休息，那不是退步。'},
  charity:{n:'慷慨',en:'CHARITY',e:'🎁',c:'#5da0c4',
    d:'你给出去的时候不太算账。时间、资源、情绪，你愿意为值得的人掏出来，甚至不期待回音。',
    t:'记得给自己留一点。'},
  temperance:{n:'节制',en:'TEMPERANCE',e:'🍃',c:'#79a86b',
    d:'你能在「想要」和「去做」之间，留出一段距离。这段距离，是你身上最珍贵的能力，也是很多人一辈子学不会的。',
    t:'节制是为了自由，不是为了苦行。'},
  chastity:{n:'贞洁',en:'CHASTITY',e:'🤍',c:'#9b8ec4',
    d:'你守得住自己的边界。你知道什么该要、什么不该碰，哪怕没人看着，你也一样——这份清澈，是很多人求不来的。',

};

var SIN_ORDER = ['pride','envy','wrath','sloth','greed','gluttony','lust'];
var VIRTUE_ORDER = ['humility','kindness','patience','diligence','charity','temperance','chastity'];

/* ============================================================
   二、题库（前 15 题测罪 / 后 15 题测德）

  /* ---------- 罪 01-15 ---------- */

/* ============================================================
   三、工具函数
   ============================================================ */
function $(s){ return document.querySelector(s); }

function polar(cx,cy,r,deg){
  var a = (deg - 90) * Math.PI / 180;
  return [cx + r*Math.cos(a), cy + r*Math.sin(a)];
}
function sector(cx,cy,rIn,rOut,a0,a1){
  var p1 = polar(cx,cy,rOut,a0), p2 = polar(cx,cy,rOut,a1);
  var p3 = polar(cx,cy,rIn,a1),  p4 = polar(cx,cy,rIn,a0);
  var large = (a1 - a0) > 180 ? 1 : 0;
  return 'M'+p1[0].toFixed(2)+','+p1[1].toFixed(2)+
         ' A'+rOut+','+rOut+' 0 '+large+' 1 '+p2[0].toFixed(2)+','+p2[1].toFixed(2)+
         ' L'+p3[0].toFixed(2)+','+p3[1].toFixed(2)+
         ' A'+rIn+','+rIn+' 0 '+large+' 0 '+p4[0].toFixed(2)+','+p4[1].toFixed(2)+' Z';
}
function topKey(obj, order){
  var best = order[0], bv = -1;
  for(var i=0;i<order.length;i++){
    var k = order[i];
    if(obj[k] > bv){ bv = obj[k]; best = k; }
  }
  return best;
}

/* ============================================================
   四、状态
   ============================================================ */
var state = {
  i: 0,
  lock: false,
  sin: {},
  vir: {}
};

function resetState(){
  state.i = 0;
  state.lock = false;
  state.sin = {};
  state.vir = {};
  SIN_ORDER.forEach(function(k){ state.sin[k] = 0; });
  VIRTUE_ORDER.forEach(function(k){ state.vir[k] = 0; });
}

/* ============================================================
   五、页面切换
   ============================================================ */
function show(id){
  ['screen-start','screen-quiz','screen-result'].forEach(function(s){
    var el = document.getElementById(s);
    if(s === id) el.classList.remove('hidden');
    else el.classList.add('hidden');
  });
  $('#stage').scrollTop = 0;
}

/* ============================================================
   六、答题渲染
   ============================================================ */
function renderQuestion(i){
  var isSin = i < 15;
  document.body.classList.toggle('light', !isSin);

  $('#qPart').textContent = isSin ? 'DARK SIDE' : 'LIGHT SIDE';
  $('#qNum').textContent = (i+1 < 10 ? '0' : '') + (i+1) + ' / 30';
  $('#bar').style.width = (i / QS.length * 100) + '%';

  var q = QS[i];
  $('#qText').textContent = q.t;

  var box = $('#opts');
  box.innerHTML = '';
  q.o.forEach(function(o, j){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt';
    b.innerHTML = '<i>' + String.fromCharCode(65 + j) + '</i><span>' + o.t + '</span>';
    b.addEventListener('click', function(){ choose(o.k, b); });
    box.appendChild(b);
  });
}

function choose(key, btn){
  if(state.lock) return;
  state.lock = true;
  btn.classList.add('picked');

  if(state.sin[key] !== undefined) state.sin[key]++;
  else state.vir[key]++;

  setTimeout(function(){
    state.lock = false;
    state.i++;
    if(state.i >= QS.length){
      $('#bar').style.width = '100%';
      setTimeout(finish, 260);
    } else {
      var card = $('#card');
      card.classList.add('out');
      setTimeout(function(){
        renderQuestion(state.i);
        card.classList.remove('out');
      }, 250);
    }
  }, 340);
}

/* ============================================================
   七、结果计算与渲染
   ============================================================ */
function finish(){
  var sinKey = topKey(state.sin, SIN_ORDER);
  var virKey = topKey(state.vir, VIRTUE_ORDER);

  var sinMeta = SINS[sinKey];
  var virMeta = VIRTUES[virKey];

  setAvatar($('#sinAvatar'), sinMeta.e, sinMeta.c);
  $('#sinName').textContent = sinMeta.n;
  $('#sinEn').textContent = sinMeta.en;
  $('#sinDesc').textContent = sinMeta.d;
  $('#sinTip').textContent = sinMeta.t;

  setAvatar($('#virAvatar'), virMeta.e, virMeta.c);
  $('#virName').textContent = virMeta.n;
  $('#virEn').textContent = virMeta.en;
  $('#virDesc').textContent = virMeta.d;
  $('#virTip').textContent = virMeta.t;

  buildChart();
  buildLegend();

  show('screen-result');
}

function setAvatar(el, emoji, color){
  /* 想换成 AI 生成的插画，把下面这行改成：
     el.innerHTML = '<div class="aura" style="--c:'+color+'"></div><img src="demon_pride.png" style="width:100%;height:100%;object-fit:contain">';
  */
  el.innerHTML =
    '<div class="aura" style="--c:'+color+'"></div>' +
    '<div class="ring" style="--c:'+color+'"></div>' +
    '<div class="face">'+emoji+'</div>';
}

function buildChart(){
  var svg = $('#chart');
  var cx = 150, cy = 150, rIn = 54, rOut = 132;

  var items = [];
  SIN_ORDER.forEach(function(k){ items.push({k:k, v:state.sin[k], type:'sin'}); });
  VIRTUE_ORDER.forEach(function(k){ items.push({k:k, v:state.vir[k], type:'virtue'}); });

  var maxSin = 1, maxVir = 1;
  SIN_ORDER.forEach(function(k){ if(state.sin[k] > maxSin) maxSin = state.sin[k]; });
  VIRTUE_ORDER.forEach(function(k){ if(state.vir[k] > maxVir) maxVir = state.vir[k]; });

  var step = 360 / items.length;
  var gap = 1.8;
  var html = '';

  /* 底环 */
  items.forEach(function(it, i){
    var a0 = i*step + gap/2, a1 = (i+1)*step - gap/2;
    var fill = it.type === 'sin' ? 'rgba(255,255,255,.045)' : 'rgba(0,0,0,.05)';
    html += '<path d="'+sector(cx,cy,rIn,rOut,a0,a1)+'" fill="'+fill+'"/>';
  });

  /* 数据扇区 */
  items.forEach(function(it, i){
    var meta = it.type === 'sin' ? SINS[it.k] : VIRTUES[it.k];
    var max = it.type === 'sin' ? maxSin : maxVir;
    var ratio = it.v / max;
    var r = rIn + (rOut - rIn) * ratio;
    if(r < rIn + 3) r = rIn + 3;
    var a0 = i*step + gap/2, a1 = (i+1)*step - gap/2;
    html += '<path class="seg" style="animation-delay:'+(i*0.045).toFixed(2)+'s" ' +
            'd="'+sector(cx,cy,rIn,r,a0,a1)+'" fill="'+meta.c+'" opacity=".9"/>';
  });

  svg.innerHTML = html;
}

function buildLegend(){
  var html = '';
  SIN_ORDER.forEach(function(k){
    var m = SINS[k];
    html += '<span><b style="background:'+m.c+'"></b>'+m.n+'</span>';
  });
  VIRTUE_ORDER.forEach(function(k){
    var m = VIRTUES[k];
    html += '<span><b style="background:'+m.c+'"></b>'+m.n+'</span>';
  });
  $('#legend').innerHTML = html;
}

/* ============================================================
   八、背景粒子
   ============================================================ */
(function particles(){
  var canvas = document.getElementById('bg');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
  var dots = [];
  var COUNT = 70;

  function resize(){
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function init(){
    dots = [];
    for(var i=0;i<COUNT;i++){
      dots.push({
        x: Math.random()*W,
        y: Math.random()*H,
        r: Math.random()*1.6 + 0.4,
        vx: (Math.random()-0.5)*0.12,
        vy: (Math.random()-0.5)*0.12,
        a: Math.random()*0.5 + 0.15
      });
    }
  }

  function loop(){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<dots.length;i++){
      var d = dots[i];
      d.x += d.vx; d.y += d.vy;
      if(d.x < -10) d.x = W+10;
      if(d.x > W+10) d.x = -10;
      if(d.y < -10) d.y = H+10;
      if(d.y > H+10) d.y = -10;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(201,169,97,' + d.a + ')';
      ctx.fill();
    }
    requestAnimationFrame(loop);
  }

  resize();
  init();
  loop();
  window.addEventListener('resize', function(){ resize(); init(); });
})();

   九、事件绑定
   ============================================================ */

  resetState();
  show('screen-quiz');
  document.body.classList.remove('light');
  renderQuestion(0);
});

$('#btnAgain').addEventListener('click', function(){
  resetState();
  document.body.classList.remove('light');
  show('screen-start');
});

resetState();

})();
